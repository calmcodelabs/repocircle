# Fast gate + deploy to GitHub Pages. Actions pinned to commit SHAs (SECURITY.md §8).
#
# This workflow is the one that blocks the deploy, so it holds only the layers
# that are both fast and decisive: lint, types, the static gates, unit, rules,
# the build, and the artifact smoke. Target is under six minutes (TESTING.md §8).
#
# The expensive layers — integration, component, E2E, accessibility — run in
# full.yml, in parallel with this, and publish reports without holding a deploy
# hostage. That split is the whole answer to "does exhaustive testing slow
# deployment": it does not, because it is not on this path.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fast gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      # Static gates + unit. The registry completeness checks live here, so an
      # unclaimed source file or an untagged test fails before anything slow runs.
      - run: npm run test
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
      - name: Firestore rules tests (emulator)
        run: npm run test:rules
      - run: npm run build
      # The shipped bytes: BUILD_ID stamped and changing, CSP closed, no
      # emulator wiring, inside the gzip budget (Class D, ADR-026).
      - name: Artifact smoke
        run: npm run test:artifact
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
